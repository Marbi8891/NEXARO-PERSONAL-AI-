services:
  nexaro-prompt-library:
    build: .
    container_name: nexaro-prompt-library
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      NEXARO_DB_PATH: /data/nexaro.db
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - nexaro_prompt_data:/data
    restart: unless-stopped
    # Connect this service to the existing private Ollama network before use.
volumes:
  nexaro_prompt_data:
