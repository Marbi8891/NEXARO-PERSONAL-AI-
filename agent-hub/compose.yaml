services:
  nexaro-agent-hub:
    build:
      context: ..
      dockerfile: agent-hub/Dockerfile
    container_name: nexaro-agent-hub
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_DEFAULT_MODEL: qwen2.5:3b
      AGENT_CATALOGUE_PATH: /app/catalogue.json
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      WORKSPACE_DIR: /workspace
      CODING_AGENT_MAX_ITERATIONS: "20"
      CODING_AGENT_ENABLED: ${CODING_AGENT_ENABLED:-false}
      CODING_AGENT_ALLOW_COMMANDS: ${CODING_AGENT_ALLOW_COMMANDS:-false}
      AGENT_HUB_API_TOKEN: ${AGENT_HUB_API_TOKEN:-}
    volumes:
      - ./workspace:/workspace
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - nexaro_ai

networks:
  nexaro_ai:
    external: true
    name: nexaro_ai
