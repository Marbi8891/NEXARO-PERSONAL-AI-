[project]
name = "nexaro"
version = "0.3.0"
description = "NEXARO: plataforma de IA híbrida (local + cloud) con núcleo compartido."
readme = "README.md"
requires-python = ">=3.10"
# Las dependencias viven en requirements/*.txt (ver docs/decisions/0002).

[tool.pytest.ini_options]
pythonpath = ["packages", "apps/api", "."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "security: pruebas de seguridad (autorización, aislamiento, abuso)",
    "integration: pruebas que levantan la app completa",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["_to_delete", ".venv-nexaro-tests", "infrastructure/aws/terraform/.terraform"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "C4", "RUF"]
ignore = ["S101"]  # assert es válido en tests; el código de producción no lo usa para validar

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]  # contraseñas y tokens ficticios en tests
"products/**/prompts.py" = ["E501"]  # texto de prompt: prosa, no código

[tool.mypy]
python_version = "3.10"
mypy_path = ["packages", "apps/api", "."]
explicit_package_bases = true
namespace_packages = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
exclude = ["^_to_delete/", "^\\.venv", "^tests/"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["packages", "apps/api/nexaro_api", "products"]
branch = true

[tool.coverage.report]
# Objetivo realista y medido; se sube a medida que crece el código. No se infla con tests triviales.
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff.lint.isort]
known-first-party = ["nexaro_core", "nexaro_api", "ai_gateway", "products"]
