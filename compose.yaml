services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexaro-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "qwen2.5:3b"
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_NUM_CTX: "4096"
      ALLOWED_ORIGINS: "http://127.0.0.1:8001,http://localhost:8001"
      DATABASE_PATH: "/data/nexaro.db"
      API_DOCS: "false"
      LOGIN_IP_MAX_ATTEMPTS: "50"
      HEALTH_CACHE_SECONDS: "5"
    volumes:
      - nexaro_data:/data
      - ./frontend:/app/frontend:ro
    networks:
      - ollama_net

volumes:
  nexaro_data:

networks:
  ollama_net:
    external: true
    name: ollama-local_default
