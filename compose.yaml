# Nombre fijo: el volumen de datos es `nexaro-personal-ai_nexaro_data` aunque se clone en otra carpeta.
name: nexaro-personal-ai

# Dos modos de Ollama (ADR-0021):
# - externo (por defecto): el contenedor `ollama` de ~/Docker/ollama-local, red `ollama-local_default`.
# - incluido: perfil `ollama` (COMPOSE_PROFILES=ollama y OLLAMA_NETWORK=nexaro_ollama en .env).
# En ambos el backend lo encuentra como http://ollama:11434. Ollama nunca publica puertos aquí.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexaro-backend
    restart: unless-stopped
    # Solo loopback. NEXARO_PORT (.env) si 8001 está ocupado; entonces ajusta también ALLOWED_ORIGINS.
    ports:
      - "127.0.0.1:${NEXARO_PORT:-8001}:8000"
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:3b}"
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_NUM_CTX: "4096"
      # Acceso remoto privado (REMOTE_ACCESS.md): añade aquí la URL https de Tailscale Serve y
      # activa COOKIE_SECURE=true en .env. El puerto sigue publicado solo en 127.0.0.1.
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://127.0.0.1:8001,http://localhost:8001}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      DATABASE_PATH: "/data/nexaro.db"
      OBSIDIAN_VAULT_PATH: "/knowledge/obsidian"
      # Además de los administradores, cuentas que pueden leer el Vault (separadas por comas).
      OBSIDIAN_ALLOWED_EMAILS: "${OBSIDIAN_ALLOWED_EMAILS:-}"
      # Lo escribe scripts/backup_nexaro.ps1; lo muestra Administración > Operaciones.
      BACKUP_STATUS_PATH: "/data/backup-status.json"
      API_DOCS: "false"
      LOGIN_IP_MAX_ATTEMPTS: "50"
      HEALTH_CACHE_SECONDS: "5"
    volumes:
      - nexaro_data:/data
      - ./frontend:/app/frontend:ro
      # Obsidian Vault: bind mount explicitly configured by the user, read-only.
      - ${OBSIDIAN_VAULT_HOST_PATH:-./obsidian-vault}:/knowledge/obsidian:ro
    networks:
      - ollama_net
    # Solo cuenta con el perfil `ollama` activo: espera a que el Ollama incluido esté sano. Con el
    # Ollama externo no hay dependencia posible entre proyectos; el backend arranca igual y
    # /api/health responde 503 hasta que Ollama y el modelo estén disponibles. Compose >= 2.20.
    depends_on:
      ollama:
        condition: service_healthy
        required: false
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 1g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  ollama:
    profiles: ["ollama"]
    # ASSUMPTION: misma imagen que ~/Docker/ollama-local. Fija una versión o digest tras la
    # primera descarga (OLLAMA_IMAGE en .env); ver DEPLOYMENT.md.
    image: "${OLLAMA_IMAGE:-ollama/ollama:latest}"
    container_name: nexaro-ollama
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_models:/root/.ollama  # modelos persistentes (~2 GB por qwen2.5:3b)
    networks:
      ollama_net:
        aliases:
          - ollama
    healthcheck:
      # `ollama list` consulta la API del servidor: falla si no atiende peticiones.
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: "${OLLAMA_MEM_LIMIT:-6g}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nexaro_data:
  ollama_models:

networks:
  ollama_net:
    external: true
    name: "${OLLAMA_NETWORK:-ollama-local_default}"
