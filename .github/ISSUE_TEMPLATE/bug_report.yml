name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerabilities must not be reported here.** Follow [SECURITY.md](../blob/main/SECURITY.md).
        Never paste passwords, API keys, cookies, `.env` contents, real conversations or personal data.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. make up
        2. Open Chat and ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installation / Docker
        - Chat / models
        - Agents
        - Documents / retrieval
        - Prompt library
        - Organizations / API keys
        - Administration / security / operations
        - Backup / restore
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NEXARO version or commit
      placeholder: v1.0.0 or the output of `git rev-parse --short HEAD`
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker, bundled Ollama
        - Docker, external Ollama
        - Local development (make run)
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Docker/Compose version, model (e.g. qwen2.5:3b)"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "`docker compose logs --tail 100 backend` and the `request_id` if you have it. Remove anything sensitive."
      render: text
