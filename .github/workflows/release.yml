name: Release

# Publica una versión al empujar una etiqueta vX.Y.Z (docs/development/release-process.md).
# No sube imágenes a ningún registro: NEXARO se construye desde el código en la máquina de destino.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: La etiqueta coincide con la versión de pyproject.toml y con CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [ "v${version}" = "${TAG}" ] || { echo "::error::La etiqueta ${TAG} no coincide con pyproject.toml (${version})"; exit 1; }
          grep -q "^## \[${version}\]" CHANGELOG.md || { echo "::error::Falta la sección [${version}] en CHANGELOG.md"; exit 1; }
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy packages products apps
      - name: Tests (PostgreSQL obligatorio)
        env:
          NEXARO_REQUIRE_POSTGRES: "1"
        run: pytest --cov=packages --cov=products --cov=apps --cov-report=term

  image:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: docker build -t nexaro-api:release .
      - name: Escaneo de la imagen (HIGH/CRITICAL con parche disponible)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nexaro-api:release
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  publish:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: write # crear la release y adjuntar el SBOM; nada más
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: SBOM (CycloneDX)
        run: |
          pip install cyclonedx-bom==9.0.0
          cyclonedx-py requirements requirements/base.txt --of JSON -o "sbom-${GITHUB_REF_NAME}.cdx.json"
      - name: Notas de la versión desde CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {found = 1; next} found && /^## / {exit} found' \
            CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || { echo "::error::Sección vacía para ${version} en CHANGELOG.md"; exit 1; }
      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "NEXARO $TAG" --notes-file release-notes.md "sbom-${TAG}.cdx.json"
