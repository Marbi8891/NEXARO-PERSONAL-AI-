name: Agent Hub tests

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "agent-hub/**"
      - "docs/agents/**"
      - ".github/workflows/agent-hub-tests.yml"
  pull_request:
    paths:
      - "agent-hub/**"
      - "docs/agents/**"
      - ".github/workflows/agent-hub-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-hub/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=. pytest -q
