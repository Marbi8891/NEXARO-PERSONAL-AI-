name: CI

on:
  push:
    branches: [main, "refactor/**", "security/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy packages products apps
      - name: Tests con cobertura (umbral en pyproject.toml)
        env:
          NEXARO_REQUIRE_POSTGRES: "1"  # valida el DDL de PostgreSQL con un servidor real (pgserver)
        run: pytest --cov=packages --cov=products --cov=apps --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit bandit cyclonedx-bom
      - name: Vulnerabilidades en dependencias (incluye transitivas)
        run: pip-audit -r requirements/base.txt -r requirements/aws.txt
      - name: Análisis estático de seguridad (Bandit)
        run: bandit -q -r apps packages products --severity-level medium --confidence-level medium -x tests
      - name: SBOM (CycloneDX)
        run: cyclonedx-py requirements requirements/base.txt --of JSON -o sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json
      # Binario oficial con checksum en lugar de gitleaks-action: la acción calcula el rango del PR
      # como `<primer commit>^..HEAD` y falla (exit 1) cuando el PR incluye el commit raíz.
      - name: Secretos en el repositorio (historial completo)
        env:
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          # Solo la historia de lo que se prueba (HEAD); .gitleaksignore lista los falsos positivos revisados.
          ./gitleaks git --redact --verbose --exit-code 1 --log-opts="HEAD" .

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, staging, prod]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - run: terraform fmt -check -recursive infrastructure/aws/terraform
      - name: validate (sin credenciales ni estado remoto)
        working-directory: infrastructure/aws/terraform/envs/${{ matrix.env }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

  terraform-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Escaneo de configuración (informativo en la primera ejecución)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infrastructure/aws/terraform
          severity: HIGH,CRITICAL
          exit-code: "0" # pasar a "1" tras revisar los primeros hallazgos (VERIFY)

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: docker build -t nexaro-api:ci .
      - name: Escaneo de la imagen (HIGH/CRITICAL con parche disponible)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nexaro-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Arranque y healthcheck
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DATABASE_PATH=/tmp/ci.db nexaro-api:ci
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/api/health/live; then
              # La imagen debe servir la interfaz sin bind mount.
              curl -fsS http://127.0.0.1:8000/ | grep -qi '<html' && exit 0
            fi
            sleep 1
          done
          docker logs api
          exit 1
