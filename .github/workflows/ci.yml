name: CI

on:
  push:
    branches: [main, "refactor/**", "security/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy packages products apps
      - name: Tests con cobertura (umbral en pyproject.toml)
        env:
          NEXARO_REQUIRE_POSTGRES: "1"  # valida el DDL de PostgreSQL con un servidor real (pgserver)
        run: pytest --cov=packages --cov=products --cov=apps --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit bandit cyclonedx-bom
      - name: Vulnerabilidades en dependencias (incluye transitivas)
        run: pip-audit -r requirements/base.txt -r requirements/aws.txt
      - name: Análisis estático de seguridad (Bandit)
        run: bandit -q -r apps packages products --severity-level medium --confidence-level medium -x tests
      - name: SBOM (CycloneDX)
        run: cyclonedx-py requirements requirements/base.txt --of JSON -o sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
      - name: Secretos en el repositorio
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infrastructure/aws/terraform
      - name: validate (sin credenciales ni estado remoto)
        working-directory: infrastructure/aws/terraform/envs/${{ matrix.env }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

  terraform-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escaneo de configuración (informativo en la primera ejecución)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: infrastructure/aws/terraform
          severity: HIGH,CRITICAL
          exit-code: "0" # pasar a "1" tras revisar los primeros hallazgos (VERIFY)

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nexaro-api:ci .
      - name: Escaneo de la imagen (HIGH/CRITICAL con parche disponible)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: nexaro-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Arranque y healthcheck
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DATABASE_PATH=/tmp/ci.db -e FRONTEND_PATH=/nonexistent nexaro-api:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/api/health/live && exit 0
            sleep 1
          done
          docker logs api
          exit 1
